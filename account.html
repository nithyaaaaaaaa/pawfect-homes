
<!DOCTYPE html>

  <style>

    .chat-button {

      max-height: 300px;

    .chat-message {
  background: #f1f3f5;

}

.chat-message.my-message {
  background: #d9edff;

}

  background: #f1f3f5;

}

.chat-message.my-message {
  background: #d9edff;

}

.chat-message.their-message {
  background: #f1f3f5;
  align-self: flex-start;
}

    .chat-message small {
      display: block;
      margin-bottom: 5px;
      color: #526653;
    }

    .chat-form {
      display: flex;

    }

      flex: 1;

/* Better spacing between application buttons */
.chat-button,
.choose,
.decline {
  margin-right: 10px;
  margin-bottom: 10px;
}

.chat-button {
  display: inline-block;
}


#floatingChatWidget {
  position: fixed;
  right: 22px;
  bottom: 22px;
  z-index: 1000;
  font-family: Arial, sans-serif;
}

#floatingChatToggle {
  background: #355e3b;

  box-shadow: 0 4px 14px #0002;
  font-weight: bold;
}

#floatingChatPanel {
  width: 340px;
  max-width: calc(100vw - 32px);

  max-height: 70vh;
  background: white;

<body>
  <nav>
    <strong>🐾 Pawfect Homes</strong>
    <div>
      <a href="index.html">Home</a>
      <a href="adopt.html">Adopt</a>
      <a href="list-pet.html">Rehome</a>
    </div>
  </nav>

  <header>
    <h1>My Account 🐾</h1>
    <p>Keep track of your pets and adoption applications.</p>
  </header>

 <div class="tabs">
  <button class="tab active" id="petsTab">My Pet Listings</button>
  
  <button class="tab" id="receivedTab">Applications Received</button>
  <button class="tab" id="refreshBtn">Refresh</button>
</div>

  <p id="message">Checking your account...</p>
  <main id="content"></main>
  
<div id="floatingChatWidget">
  <button id="floatingChatToggle" type="button">
    💬 Chats
  </button>

  
<section id="floatingChatPanel" hidden>
    <div class="floating-chat-header">
      <strong>Your chats</strong>
      <button id="floatingChatClose" type="button"
        aria-label="Close chats">×</button>
    </div>

    <button id="enableChatNotifications" type="button">
      Enable notifications 🔔
    </button>

    <div id="floatingChatList">
      Open your chats to see conversations.
    </div>
  </section>
</div>



  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
   
const SUPABASE_URL = "https://rgcgzsoubvbqqxcrazoj.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_3IQCKIWicsRLOH1lp4W7cA_gQ-iO5uC";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const message = document.getElementById("message");
const content = document.getElementById("content");
const petsTab = document.getElementById("petsTab");
const receivedTab = document.getElementById("receivedTab");
const refreshBtn = document.getElementById("refreshBtn");

let currentTab = "pets";
    let unreadChatCount = 0;
let activeChatChannel = null;

function showTab(tab) {
  currentTab = tab;
  petsTab.classList.toggle("active", tab === "pets");
  receivedTab.classList.toggle("active", tab === "received");
  loadData();
}

function addCard(titleText, statusText, detailsText) {
  const card = document.createElement("article");
  card.className = "card";

  const title = document.createElement("h2");
  title.textContent = titleText || "Untitled";

  const status = document.createElement("span");
  status.className = "status";
  status.textContent = statusText || "Unknown";

  const details = document.createElement("p");
  details.className = "details";
  details.textContent = detailsText || "";

  card.append(title, status, details);
  content.appendChild(card);

  // Pet listing cards intentionally have no Chat button.
}

async function markChatAsRead(applicationId, userId) {
  const { error } = await supabaseClient
    .from("adoption_chat_reads")
    .upsert(
      {
        application_id: applicationId,
        user_id: userId,
        last_read_at: new Date().toISOString()
      },
      {
        onConflict: "application_id,user_id"
      }
    );

  if (error) {
    console.error("Could not mark chat as read:", error);
    return;
  }

  await updateUnreadChatCount();
}

async function openChat(application, card, user) {
  if (activeChatChannel) {
    await supabaseClient.removeChannel(activeChatChannel);
    activeChatChannel = null;
  }

  const oldPanel = card.querySelector(".chat-panel");
  if (oldPanel) {
    oldPanel.remove();
    return;
  }
  await markChatAsRead(application.application_id, user.id);
  const panel = document.createElement("section");
  panel.className = "chat-panel";

  const heading = document.createElement("h3");
  heading.textContent = "Chat about " + (application.pet_name || "your pet");

  const note = document.createElement("p");
  note.className = "chat-note";
  note.textContent = "Private conversation about this adoption application.";

  const messagesBox = document.createElement("div");
  messagesBox.className = "chat-messages";
  messagesBox.textContent = "Loading messages...";

  const status = document.createElement("p");
  status.className = "chat-note chat-status";

  const form = document.createElement("form");
  form.className = "chat-form";

  const input = document.createElement("input");
  input.type = "text";
  input.maxLength = 2000;
  input.placeholder = "Type your message...";
  input.required = true;

  const sendButton = document.createElement("button");
  sendButton.type = "submit";
  sendButton.textContent = "Send";

  form.append(input, sendButton);
  panel.append(heading, note, messagesBox, status, form);
  card.appendChild(panel);

  const closed = application.application_status === "declined";

  if (closed) {
    input.disabled = true;
    sendButton.disabled = true;
    status.textContent = "This application is closed. Previous messages remain available.";
  }

  async function refreshMessages() {
    const { data, error } = await supabaseClient
      .from("adoption_messages")
      .select("id, sender_id, message, created_at")
      .eq("application_id", application.application_id)
      .order("created_at", { ascending: true });

    if (error) {
      messagesBox.textContent = "Could not load messages: " + error.message;
      return;
    }

    messagesBox.replaceChildren();

    if (!data || data.length === 0) {
      messagesBox.textContent = "No messages yet. Start the conversation!";
      return;
    }

    data.forEach(msg => {
      const bubble = document.createElement("div");
      bubble.className = "chat-message";

      const sender = document.createElement("small");
      sender.textContent =
        msg.sender_id === user.id ? "You" : "Other participant";

      const body = document.createElement("div");
      body.textContent = msg.message;

      const time = document.createElement("small");
      time.textContent = new Date(msg.created_at).toLocaleString();

      bubble.append(sender, body, time);
      messagesBox.appendChild(bubble);
    });

    messagesBox.scrollTop = messagesBox.scrollHeight;
  }

  form.addEventListener("submit", async event => {
    event.preventDefault();

    const text = input.value.trim();
    if (!text || closed) return;

    sendButton.disabled = true;
    status.textContent = "Sending...";

    const { error } = await supabaseClient
      .from("adoption_messages")
      .insert({
        application_id: application.application_id,
        sender_id: user.id,
        message: text
      });

    sendButton.disabled = closed;

    if (error) {
      status.textContent = "Message not sent: " + error.message;
      return;
    }

    input.value = "";
    status.textContent = "";
    await refreshMessages();
  });

  await refreshMessages();

  if (!panel.isConnected) return;

  activeChatChannel = supabaseClient
    .channel("chat-" + application.application_id)
    .on(
      "postgres_changes",
      {
        event: "INSERT",
        schema: "public",
        table: "adoption_messages",
        filter: "application_id=eq." + application.application_id
      },
      refreshMessages
    )
    .subscribe();
}

async function loadData() {
  content.replaceChildren();
  message.textContent = "Loading...";

  if (activeChatChannel) {
    await supabaseClient.removeChannel(activeChatChannel);
    activeChatChannel = null;
  }

  const {
    data: { user },
    error: authError
  } = await supabaseClient.auth.getUser();

  if (authError || !user) {
    message.textContent = "Please sign in first using your Pawfect Homes account.";
    return;
  }

  if (currentTab === "received") {
    const { data, error } = await supabaseClient.rpc(
      "owner_list_applications"
    );

    if (error) {
      console.error(error);
      message.textContent = "Could not load received applications: " + error.message;
      return;
    }

    if (!data || data.length === 0) {
      message.textContent = "No applications yet for your pets. Check back later! 🐾";
      return;
    }

    message.textContent = data.length + " application(s) received.";

    data.forEach(application => {
      const card = document.createElement("article");
      card.className = "card";

      const title = document.createElement("h2");
      title.textContent = application.pet_name || "Your pet";

      const status = document.createElement("span");
      status.className = "status";
      status.textContent = "Application: " + application.application_status;

      const details = document.createElement("p");
      details.className = "details";
      details.textContent =
        "Applicant: " + (application.full_name || "Not provided") +
        "\nPhone: " + (application.phone || "Not provided") +
        "\nLiving situation: " + (application.living_situation || "Not provided") +
        "\nPet experience: " + (application.pet_experience || "Not provided") +
        "\nSubmitted: " +
        (application.submitted_at
          ? new Date(application.submitted_at).toLocaleString()
          : "Unknown");

      card.append(title, status, details);

      // Chat belongs on applicant cards, not pet listing cards.
      const chatButton = document.createElement("button");
      chatButton.className = "chat-button";
      chatButton.textContent = "Chat";

      chatButton.addEventListener("click", async () => {
        await openChat(application, card, user);
      });

      card.appendChild(chatButton);

      if (application.application_status === "pending") {
        const choose = document.createElement("button");
        choose.className = "choose";
        choose.textContent = "Choose this adopter";

        choose.addEventListener("click", async () => {
          if (!confirm(
            "Choose " + (application.full_name || "this applicant") +
            " for " + (application.pet_name || "your pet") +
            "? Other pending applications for this pet will be declined, and the pet will be marked adopted."
          )) return;

          choose.disabled = true;

          const { data: success, error: reviewError } =
            await supabaseClient.rpc("owner_review_application", {
              p_application_id: application.application_id,
              p_new_status: "approved"
            });

          if (reviewError || success !== true) {
            alert(
              "Could not choose this applicant: " +
              (reviewError?.message || "The application may already have been reviewed.")
            );
            choose.disabled = false;
            return;
          }

          alert("Adopter selected successfully! 🐾");
          await loadData();
        });

        const decline = document.createElement("button");
        decline.className = "decline";
        decline.textContent = "Decline";

        decline.addEventListener("click", async () => {
          if (!confirm(
            "Decline this application from " +
            (application.full_name || "this applicant") + "?"
          )) return;

          decline.disabled = true;

          const { data: success, error: reviewError } =
            await supabaseClient.rpc("owner_review_application", {
              p_application_id: application.application_id,
              p_new_status: "declined"
            });

          if (reviewError || success !== true) {
            alert(
              "Could not decline this application: " +
              (reviewError?.message || "The application may already have been reviewed.")
            );
            decline.disabled = false;
            return;
          }

          await loadData();
        });

        card.append(choose, decline);
      }

      content.appendChild(card);
    });

    return;
  }

  // My Pet Listings tab
  const { data, error } = await supabaseClient.rpc("my_pet_listings");

  if (error) {
    console.error(error);
    message.textContent = "Could not load listings: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    message.textContent = "You haven't submitted any pet listings yet.";
    return;
  }

  message.textContent = data.length + " pet listing(s).";

  data.forEach(pet => {
    addCard(
      pet.name,
      "Listing: " + pet.status,
      "Animal: " + (pet.animal_type || "Not specified") +
      "\nBreed: " + (pet.breed || "Not specified") +
      "\nAge: " + (pet.age_description || "Not specified") +
      "\nSubmitted: " + new Date(pet.created_at).toLocaleDateString()
    );
  });
}


async function loadFloatingChats() {
  const list = document.getElementById("floatingChatList");
  list.textContent = "Loading conversations...";

  const { data: { user }, error: authError } =
    await supabaseClient.auth.getUser();

  if (authError || !user) {
    list.textContent = "Please sign in to view your chats.";
    return;
  }

  const { data, error } =
    await supabaseClient.rpc("my_adoption_chats");

  if (error) {
    list.textContent = "Could not load chats: " + error.message;
    return;
  }

  // Show conversations after at least one message is sent.
  const chats = (data || []).filter(chat => chat.last_message_at);

  list.replaceChildren();

  if (chats.length === 0) {
    list.textContent = "No conversations yet. Start a chat from Applications Received!";
    return;
  }

  chats.forEach(chat => {
    const item = document.createElement("article");
    item.className = "inbox-conversation";

    const title = document.createElement("strong");
    title.textContent = chat.pet_name || "Pet conversation";

    const person = document.createElement("p");
    person.textContent = chat.other_person_name || "Other participant";

    const preview = document.createElement("p");
    preview.textContent = chat.last_message || "No messages yet";

    const status = document.createElement("p");
    status.textContent = "Application: " + chat.application_status;

    const openButton = document.createElement("button");
    openButton.type = "button";
    openButton.className = "inbox-open-chat";
    openButton.textContent = "chat";

    openButton.addEventListener("click", async () => {
      openButton.disabled = true;
      try {
        await openChat(chat, item, user);
      } catch (err) {
        console.error(err);
        alert("Could not open this chat. Please try again.");
      } finally {
        openButton.disabled = false;
      }
    });

    item.append(title, person, preview, status, openButton);
    list.appendChild(item);
  });
}

async function updateUnreadChatCount() {
  const button = document.getElementById("floatingChatToggle");
  if (!button) return;

  const { data: { user }, error: authError } =
    await supabaseClient.auth.getUser();

  if (authError || !user) {
    unreadChatCount = 0;
    button.textContent = "💬 Chats";
    return;
  }

  const { data: chats, error: chatsError } =
    await supabaseClient.rpc("my_adoption_chats");

  if (chatsError) {
    console.error("Could not count unread chats:", chatsError);
    return;
  }

  const { data: reads, error: readsError } =
    await supabaseClient
      .from("adoption_chat_reads")
      .select("application_id, last_read_at")
      .eq("user_id", user.id);

  if (readsError) {
    console.error("Could not load read status:", readsError);
    return;
  }

  const readMap = new Map(
    (reads || []).map(read => [
      read.application_id,
      read.last_read_at
    ])
  );

  let totalUnread = 0;

  for (const chat of chats || []) {
    const lastRead = readMap.get(chat.application_id);

    let query = supabaseClient
      .from("adoption_messages")
      .select("id")
      .eq("application_id", chat.application_id)
      .neq("sender_id", user.id);

    if (lastRead) {
      query = query.gt("created_at", lastRead);
    }

    const { data: messages, error } = await query;

    if (error) {
      console.error("Could not count messages:", error);
      continue;
    }

    totalUnread += (messages || []).length;
  }

  unreadChatCount = totalUnread;
  button.textContent =
    totalUnread > 0
      ? `💬 Chats (${totalUnread})`
      : "💬 Chats";
}

const floatingChatToggle =
  document.getElementById("floatingChatToggle");
const floatingChatPanel =
  document.getElementById("floatingChatPanel");
const floatingChatClose =
  document.getElementById("floatingChatClose");
    
const enableChatNotifications =
  document.getElementById("enableChatNotifications");

enableChatNotifications.addEventListener("click", async () => {
  if (!("Notification" in window)) {
    alert("Your browser does not support notifications.");
    return;
  }

  const permission = await Notification.requestPermission();

  if (permission === "granted") {
    enableChatNotifications.textContent = "Notifications enabled ✓";
  } else {
    enableChatNotifications.textContent = "Notifications blocked";
  }
});


floatingChatToggle.addEventListener("click", async () => {
  floatingChatPanel.hidden = !floatingChatPanel.hidden;

  if (!floatingChatPanel.hidden) {
    await loadFloatingChats();
    await updateUnreadChatCount();
  }
});


floatingChatClose.addEventListener("click", () => {
  floatingChatPanel.hidden = true;
});
    
let floatingInboxChannel = null;

function startFloatingInboxUpdates() {
  if (floatingInboxChannel) return;

  floatingInboxChannel = supabaseClient
    .channel("floating-inbox-live-updates")
    .on(
      "postgres_changes",
      {
        event: "INSERT",
        schema: "public",
        table: "adoption_messages"
      },
      
      async payload => {
        const chatIsOpen =
          document.querySelector(
            "#floatingChatList .chat-panel"
          );

        if (chatIsOpen) {
          await updateUnreadChatCount();
          return;
        }

        if (!floatingChatPanel.hidden) {
          await loadFloatingChats();
        }

        await updateUnreadChatCount();

        if (
          payload.new.sender_id !==
          (await supabaseClient.auth.getUser()).data.user?.id
        ) {
          if ("Notification" in window &&
              Notification.permission === "granted") {
            new Notification("Pawfect Homes", {
              body: "You received a new chat message."
            });
          }
        }
      }

    )
    .subscribe();
}

startFloatingInboxUpdates();


petsTab.addEventListener("click", () => showTab("pets"));
receivedTab.addEventListener("click", () => showTab("received"));
refreshBtn.addEventListener("click", loadData);

loadData();



    
  </script>
