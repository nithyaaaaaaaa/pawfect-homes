
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account | Pawfect Homes</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f6ef;
      color: #263b2b;
    }

    nav {
      padding: 18px 7%;
      background: #fffdf7;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      border-bottom: 1px solid #e0e5d9;
    }

    nav strong { font-size: 20px; }
    nav a { color: #355e3b; text-decoration: none; margin-left: 14px; }

    header { padding: 35px 7% 15px; }

    header h1 { margin-bottom: 8px; }

    .tabs {
      padding: 0 7% 24px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 16px;
      cursor: pointer;
      font-size: 14px;
    }

    .tab { background: #e7ecdf; color: #263b2b; }
    .tab.active { background: #355e3b; color: white; }

    #message { margin: 0 7% 20px; }

    main {
      padding: 0 7% 50px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 18px;
    }

    .card {
      background: white;
      border: 1px solid #e0e5d9;
      border-radius: 15px;
      padding: 20px;
      overflow-wrap: anywhere;
    }

    .card h2 { margin-top: 0; }

    .status {
      display: inline-block;
      background: #edf3e8;
      border-radius: 20px;
      padding: 6px 10px;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .details { line-height: 1.7; white-space: pre-line; }
    
    .choose,
    .decline {
      border: none;
      border-radius: 9px;
      padding: 11px 18px;
      margin: 8px 8px 4px 0;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      color: white;
    }

    .choose {
      background: #2e7d32;
    }

    .choose:hover {
      background: #1b5e20;
    }

    .decline {
      background: #d32f2f;
    }

    .decline:hover {
      background: #b71c1c;
    }

    .choose:disabled,
    .decline:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .chat-button {
      background: #355e3b;
      color: white;
      margin-top: 12px;
    }

    .chat-panel {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #e0e5d9;
    }

    .chat-messages {
      max-height: 300px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 14px 0;
    }

    .chat-message {
      background: #f1f4ec;
      border-radius: 10px;
      padding: 10px;
      overflow-wrap: anywhere;
    }

    .chat-message small {
      display: block;
      margin-bottom: 5px;
      color: #526653;
    }

    .chat-form {
      display: flex;
      gap: 8px;
    }

    .chat-form input {
      flex: 1;
      min-width: 0;
      padding: 11px;
      border: 1px solid #cbd5c5;
      border-radius: 9px;
    }

    .chat-form button {
      background: #355e3b;
      color: white;
    }

    .chat-note {
      font-size: 13px;
      color: #526653;
    }

  </style>
</head>

    <div>

 <div class="tabs">

  <button class="tab" id="receivedTab">Applications Received</button>
  <button class="tab" id="refreshBtn">Refresh</button>
</div>

  <p id="message">Checking your account...</p>
  <main id="content"></main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://rgcgzsoubvbqqxcrazoj.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_3IQCKIWicsRLOH1lp4W7cA_gQ-iO5uC";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const message = document.getElementById("message");
const content = document.getElementById("content");
const petsTab = document.getElementById("petsTab");

const receivedTab = document.getElementById("receivedTab");

let currentTab = "pets";
    
let activeChatChannel = null;

function escapeChatText(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

async function openChat(application, card, user) {
  if (activeChatChannel) {
    await supabaseClient.removeChannel(activeChatChannel);
    activeChatChannel = null;
  }

  const oldPanel = card.querySelector(".chat-panel");
  if (oldPanel) {
    oldPanel.remove();
    return;
  }

  const panel = document.createElement("section");
  panel.className = "chat-panel";
  panel.innerHTML = `
    <h3>Chat about ${escapeChatText(application.pet_name || "your pet")}</h3>
    <p class="chat-note">Only you and the other participant can access this conversation.</p>
    <div class="chat-messages">Loading messages...</div>
    <p class="chat-note chat-status"></p>
    <form class="chat-form">
      <input type="text" maxlength="2000" placeholder="Type your message..." required>
      <button type="submit">Send</button>
    </form>
  `;

  card.appendChild(panel);

  const messagesBox = panel.querySelector(".chat-messages");
  const form = panel.querySelector(".chat-form");
  const input = form.querySelector("input");
  const sendButton = form.querySelector("button");
  const status = panel.querySelector(".chat-status");

  const closed = application.application_status === "declined";

  if (closed) {
    input.disabled = true;
    sendButton.disabled = true;
    status.textContent = "This application is closed. You can read previous messages.";
  }

  async function refreshMessages() {
    const { data, error } = await supabaseClient
      .from("adoption_messages")
      .select("id, sender_id, message, created_at")
      .eq("application_id", application.application_id)
      .order("created_at", { ascending: true });

    if (error) {
      messagesBox.textContent = "Could not load messages: " + error.message;
      return;
    }

    messagesBox.replaceChildren();

    if (!data || data.length === 0) {
      messagesBox.textContent = "No messages yet. Start the conversation!";
      return;
    }

    data.forEach(msg => {
      const bubble = document.createElement("div");
      bubble.className = "chat-message";

      const sender = document.createElement("small");
      sender.textContent = msg.sender_id === user.id ? "You" : "Other participant";

      const body = document.createElement("div");
      body.textContent = msg.message;

      const time = document.createElement("small");
      time.textContent = new Date(msg.created_at).toLocaleString();

      bubble.append(sender, body, time);
      messagesBox.appendChild(bubble);
    });

    messagesBox.scrollTop = messagesBox.scrollHeight;
  }

  form.addEventListener("submit", async event => {
    event.preventDefault();

    const text = input.value.trim();
    if (!text || closed) return;

    sendButton.disabled = true;
    status.textContent = "Sending...";

    const { error } = await supabaseClient
      .from("adoption_messages")
      .insert({
        application_id: application.application_id,
        sender_id: user.id,
        message: text
      });

    sendButton.disabled = false;

    if (error) {
      status.textContent = "Message not sent: " + error.message;
      return;
    }

    input.value = "";
    status.textContent = "";
    await refreshMessages();
  });

  await refreshMessages();

  activeChatChannel = supabaseClient
    .channel("chat-" + application.application_id)
    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "adoption_messages",
        filter: "application_id=eq." + application.application_id
      },
      refreshMessages
    )
    .subscribe();
}

function showTab(tab) {
  currentTab = tab;

  petsTab.classList.toggle("active", tab === "pets");
  
  receivedTab.classList.toggle("active", tab === "received");

  loadData();
}

    function addCard(titleText, statusText, detailsText) {
      const card = document.createElement("article");
      card.className = "card";

      const title = document.createElement("h2");
      title.textContent = titleText || "Untitled";

      const status = document.createElement("span");
      status.className = "status";
      status.textContent = statusText || "Unknown";

      const details = document.createElement("p");
      details.className = "details";
      details.textContent = detailsText;

      card.append(title, status, details);
      
    const chatButton = document.createElement("button");
    chatButton.className = "chat-button";
    chatButton.textContent = "Chat";

    chatButton.addEventListener("click", async () => {
      await openChat(application, card, user);
    });

    card.appendChild(chatButton);

      
    const chatButton = document.createElement("button");
    chatButton.className = "chat-button";
    chatButton.textContent = "Chat";

    chatButton.addEventListener("click", async () => {
      await openChat(application, card, user);
    });

    card.appendChild(chatButton);

      content.appendChild(card);
    }

    async function loadData() {
      content.replaceChildren();
      message.textContent = "Loading...";

      const { data: { user }, error: authError } =
        await supabaseClient.auth.getUser();

      if (authError || !user) {
        message.textContent =
          "Please sign in first using your Pawfect Homes account.";
        return;
      }
      
if (currentTab === "received") {
  const { data, error } = await supabaseClient.rpc(
    "owner_list_applications"
  );

  if (error) {
    console.error(error);
    message.textContent =
      "Could not load received applications: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    message.textContent =
      "No applications yet for your pets. Check back later! 🐾";
    return;
  }

  message.textContent =
    data.length + " application(s) received.";

  data.forEach(application => {
    const card = document.createElement("article");
    card.className = "card";

    const title = document.createElement("h2");
    title.textContent = application.pet_name || "Your pet";

    const status = document.createElement("span");
    status.className = "status";
    status.textContent =
      "Application: " + application.application_status;

    const details = document.createElement("p");
    details.className = "details";
    details.textContent =
      "Applicant: " + (application.full_name || "Not provided") +
      "\nPhone: " + (application.phone || "Not provided") +
      "\nLiving situation: " +
      (application.living_situation || "Not provided") +
      "\nPet experience: " +
      (application.pet_experience || "Not provided") +
      "\nSubmitted: " +
      (application.submitted_at
        ? new Date(application.submitted_at).toLocaleString()
        : "Unknown");

    card.append(title, status, details);

    if (application.application_status === "pending") {
      const choose = document.createElement("button");
choose.className = "choose";
choose.textContent = "Choose this adopter";

      choose.addEventListener("click", async () => {
        if (!confirm(
          "Choose " + application.full_name +
          " for " + application.pet_name +
          "? Other pending applications for this pet will be declined, and the pet will be marked adopted."
        )) return;

        choose.disabled = true;

        const { data: success, error: reviewError } =
          await supabaseClient.rpc("owner_review_application", {
            p_application_id: application.application_id,
            p_new_status: "approved"
          });

        if (reviewError || success !== true) {
          alert(
            "Could not choose this applicant: " +
            (reviewError?.message || "The application may already have been reviewed.")
          );
          choose.disabled = false;
          return;
        }

        alert("Adopter selected successfully! 🐾");
        await loadData();
      });

      const decline = document.createElement("button");
decline.className = "decline";
decline.textContent = "Decline";

      decline.addEventListener("click", async () => {
        if (!confirm(
          "Decline this application from " +
          (application.full_name || "this applicant") + "?"
        )) return;

        decline.disabled = true;

        const { data: success, error: reviewError } =
          await supabaseClient.rpc("owner_review_application", {
            p_application_id: application.application_id,
            p_new_status: "declined"
          });

        if (reviewError || success !== true) {
          alert(
            "Could not decline this application: " +
            (reviewError?.message || "The application may already have been reviewed.")
          );
          decline.disabled = false;
          return;
        }

        await loadData();
      });

      card.append(choose, decline);
    }

    content.appendChild(card);
  });

  return;
}


      if (currentTab === "pets") {

        if (error) {

            "\nAge: " + (pet.age_description || "Not specified") +
            "\nSubmitted: " + new Date(pet.created_at).toLocaleDateString()
          );
        });

          message.textContent =

          return;

        if (!data || data.length === 0) {
          message.textContent = "You haven't applied to adopt any pets yet.";
          return;
        }

        message.textContent = data.length + " adoption application(s).";

        data.forEach(application => {
          addCard(

            "Application: " + application.application_status,
            "Animal: " + (application.animal_type || "Not specified") +

        });
      }

    petsTab.addEventListener("click", () => showTab("pets"));

receivedTab.addEventListener("click", () => showTab("received"));
document.getElementById("refreshBtn").addEventListener("click", loadData);
