
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Pawfect Homes</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #faf8f2;
      color: #304638;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 18px 7%;
      background: #fffdf8;
      border-bottom: 1px solid #e7e5da;
    }

    nav strong { font-size: 22px; }

    nav a {
      color: #304638;
      text-decoration: none;
      font-weight: bold;
      margin-left: 14px;
    }

    header {
      padding: 35px 7% 15px;
    }

    header h1 { margin-bottom: 8px; }

    header p {
      color: #657267;
      line-height: 1.5;
    }

    #message {
      margin: 20px 7%;
      padding: 14px;
      border-radius: 10px;
      background: #edf1e7;
      line-height: 1.5;
    }

    #list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 20px;
      padding: 10px 7% 50px;
    }

    .card {
      background: white;
      border: 1px solid #e5e5da;
      border-radius: 14px;
      padding: 20px;
      overflow-wrap: anywhere;
    }

    .card h2 { margin-top: 0; }

    .details {
      white-space: pre-line;
      color: #59695c;
      line-height: 1.7;
    }

    .description {
      white-space: pre-line;
      line-height: 1.6;
    }

    .status {
      display: inline-block;
      background: #fff0ce;
      color: #77551b;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 13px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 12px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    .approve {
      background: #405b46;
      color: white;
    }

    .reject {
      background: #f7e6e2;
      color: #8b3027;
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }
  </style>
</head>

<body>
  <nav>
    <strong>🐾 Pawfect Homes</strong>
    <div>
      <a href="index.html">Home</a>
      <a href="adopt.html">Adopt</a>
      <a href="list-pet.html">Rehome</a>
    </div>
  </nav>

  <header>
    <h1>Admin Dashboard 🐾</h1>
    <p>Review pet submissions before they appear on Pawfect Homes.</p>
  </header>

  <div id="message">Checking your admin access...</div>
  <main id="list"></main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://rgcgzsoubvbqqxcrazoj.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_3IQCKIWicsRLOH1lp4W7cA_gQ-iO5uC";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const message = document.getElementById("message");
    const list = document.getElementById("list");

    async function startDashboard() {
      const { data: { user }, error: userError } =
        await supabaseClient.auth.getUser();

      if (userError || !user) {
        message.textContent =
          "Please sign in to your Pawfect Homes account first.";
        return;
      }

      await loadPendingPets();
    }

    async function loadPendingPets() {
      message.textContent = "Loading pending submissions...";
      list.replaceChildren();

      const { data, error } = await supabaseClient
        .rpc("admin_list_pending_pets");

      if (error) {
        message.textContent =
          "Couldn't load submissions. Check that you're signed in with the authorized admin account.";
        console.error("Admin loading error:", error);
        return;
      }

      if (!data || data.length === 0) {
        message.textContent = "No pending pet submissions right now. 🐾";
        return;
      }

      message.textContent = data.length +
        " submission(s) waiting for review.";

      data.forEach(pet => {
        const card = document.createElement("article");
        card.className = "card";

        const title = document.createElement("h2");
        title.textContent = pet.name || "Unnamed pet";

        const status = document.createElement("span");
        status.className = "status";
        status.textContent = "Pending review";

        const details = document.createElement("p");
        details.className = "details";
        details.textContent =
          "Animal: " + (pet.animal_type || "Unknown") +
          "\nAge: " + (pet.age_description || "Unknown") +
          "\nBreed: " + (pet.breed || "Unknown") +
          "\nArea: " + (pet.found_area || "Not provided") +
          "\nListing type: " +
          (pet.listing_type === "rescued_stray"
            ? "Rescued stray" : "Owner rehoming");

        const description = document.createElement("p");
        description.className = "description";
        description.textContent =
          "Description: " + (pet.description || "Not provided") +
          "\nVaccination: " + (pet.vaccination_info || "Unknown") +
          "\nMedical info: " + (pet.medical_info || "Unknown") +
          (pet.rehoming_reason
            ? "\nRehoming reason: " + pet.rehoming_reason : "");

        const approve = document.createElement("button");
        approve.className = "approve";
        approve.textContent = "Approve listing";
        approve.addEventListener("click", () =>
          reviewPet(pet.id, "approved", card, approve, reject)
        );

        const reject = document.createElement("button");
        reject.className = "reject";
        reject.textContent = "Reject listing";
        reject.addEventListener("click", () => {
          if (confirm("Are you sure you want to reject this listing?")) {
            reviewPet(pet.id, "rejected", card, approve, reject);
          }
        });

        card.append(
          title, status, details, description, approve, reject
        );
        list.appendChild(card);
      });
    }

    async function reviewPet(id, newStatus, card, approve, reject) {
      approve.disabled = true;
      reject.disabled = true;

      const { data, error } = await supabaseClient.rpc(
        "admin_review_pet",
        {
          p_pet_id: id,
          p_new_status: newStatus
        }
      );

      if (error || data !== true) {
        alert("Couldn't update this listing. Please try again.");
        console.error("Review error:", error);
        approve.disabled = false;
        reject.disabled = false;
        return;
      }

      card.remove();

      if (!list.children.length) {
        message.textContent = "All submissions have been reviewed! 🐾";
      } else {
        message.textContent =
          "Listing " + newStatus + " successfully.";
      }
    }

    startDashboard();
  </script>
</body>
</html>
